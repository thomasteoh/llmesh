services:
  llmesh-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: llmesh-client
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./client/config.yaml:/config.yaml:ro
    restart: unless-stopped
    # Longer than shutdown_drain (60s by default), so jobs in flight can
    # finish before Docker kills the client.
    stop_grace_period: 90s
